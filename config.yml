# Версия схемы конфигурации, а не версия приложения. Сейчас поддерживается только 1.
version: 1

run:
  # Режим: evaluate, latency, list-regions или validate-config.
  # Явная CLI-подкоманда имеет приоритет над этим значением.
  mode: evaluate

aws:
  # Имя стандартного AWS-профиля. null использует стандартную credential chain AWS SDK.
  profile: null
  # Endpoint этого региона используется для DescribeRegions.
  # Он не получает преимущества при итоговом ранжировании.
  discovery_region: us-east-1
  # Разрешает увидеть регионы not-opted-in, но не включает их в аккаунте автоматически.
  include_opt_in_regions: false

workload:
  # Взаимозаменяемые типы инстансов; рекомендация выберет конкретный тип и AZ.
  instance_types: [t3.medium, t4g.medium]
  # ОС/лицензия должна точно соответствовать ProductDescription из EC2 Spot API.
  product_descriptions: ["Linux/UNIX"]
  # Требуемая ёмкость для Spot Placement Score. В v1 одна единица равна одному инстансу.
  target_capacity: 1
  # Ожидаемая длительность задачи в часах; используется для estimated compute cost.
  duration_hours: 1

regions:
  # Allowlist полных Region ID и glob-масок. "*" разрешает все доступные регионы.
  # Несколько правил объединяются по OR; поддерживается только метасимвол "*".
  included_regions: ["eu-*", "ap-south-*", "il-*"]
  # Denylist с тем же синтаксисом. Исключения всегда имеют приоритет над включениями.
  excluded_regions: []

latency:
  # Максимально допустимый RTT в миллисекундах по метрике metric.
  max_rtt_ms: 1000
  # Число прогревочных запросов; они не входят в расчёт median/p95.
  warmup_attempts: 3
  # Число учитываемых запросов после прогрева.
  attempts: 5
  # Timeout одной попытки в миллисекундах, а не общий timeout запуска.
  timeout_ms: 3000
  # Максимальное число регионов, проверяемых одновременно.
  concurrency: 8
  # Метрика пороговой фильтрации: median или p95. Median устойчивее к выбросам.
  metric: median
  # В v1 поддерживается только HTTPS; это прикладной RTT, а не ICMP ping.
  probe: https

pricing:
  # Глубина окна Spot Price History в днях до момента запуска.
  history_days: 7
  # Средняя цена взвешивается по длительности действия каждого значения.
  # В v1 поддерживается только time_weighted_average.
  statistic: time_weighted_average
  # В v1 поддерживается только USD; автоматической конвертации валют нет.
  currency: USD

placement:
  # Запрашивать ли Spot Placement Score у AWS.
  enabled: true
  # Минимальный SPS от 1 до 10. 10 — наибольшая вероятность получить ёмкость,
  # но даже максимальная оценка не является гарантией.
  min_score: 3
  # Поведение, если SPS получить не удалось: exclude, warn или ignore.
  # Успешно полученный score ниже min_score исключает регион при любой политике.
  failure_policy: warn

ranking:
  # Относительная разница в процентах, при которой цены считаются равными.
  # При ценовой ничьей побеждает кандидат с меньшим RTT.
  price_tie_relative_percent: 5.0
  # Максимальное число вариантов после основной рекомендации.
  alternatives: 20

output:
  # Формат итогового stdout: table или json. Сообщения прогресса идут в stderr.
  format: table
  # Показывать причины исключения в таблице; JSON хранит их всегда.
  explain_exclusions: true
  # Совместимый короткий переключатель debug-логов; предпочтительнее log_level.
  verbose: false
  # Минимальный уровень stderr-логов: error, warning, info или debug.
  log_level: info
