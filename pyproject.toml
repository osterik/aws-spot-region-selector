[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-spot-price-selector"
version = "0.1.0"
description = "Select an AWS region using Spot prices, placement probability, and network latency"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.34,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
spot-region-selector = "aws_spot_price_selector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
